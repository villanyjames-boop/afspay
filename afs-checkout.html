<!DOCTYPE html>
<html>
<head>
  <title>AFS Pay</title>
</head>
<body>

<h2>AFS Payment</h2>

<form id="payForm">
  <input type="email" id="email" placeholder="Email" required />
  <input type="number" id="amount" placeholder="Amount" required />
  <button type="submit">Pay</button>
</form>

<div id="paymentWidget"></div>

<script>
document.getElementById("payForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const amount = document.getElementById("amount").value;

  const res = await fetch("/api/afs/checkout", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ amount, email })
  });

  const data = await res.json();

  const script = document.createElement("script");
  script.src = `https://eu-prod.oppwa.com/v1/paymentWidgets.js?checkoutId=${data.checkoutId}`;
  script.async = true;

  document.body.appendChild(script);

  document.getElementById("paymentWidget").innerHTML =
    `<form action="/afs/result" class="paymentWidgets">VISA MASTER</form>`;
});
</script>

</body>
</html>
